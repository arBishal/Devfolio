<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Ubuntu Sans (UI) + Ubuntu Mono (terminal) + Ubuntu (minimal body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Ubuntu+Mono:wght@400;700&family=Ubuntu+Sans:wght@400;500;700&display=swap"
    />

    <!-- Primary meta -->
    <title>arBishal's Devfolio</title>
    <meta name="description" content="Software Engineer based in Dhaka, Bangladesh. Interactive terminal-style portfolio with a minimal version." />
    <meta name="author" content="Ashikur Rahman Bishal" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://dev.arbishal.com/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="arBishal's Devfolio" />
    <meta property="og:title" content="arBishal's Devfolio" />
    <meta property="og:description" content="Software Engineer based in Dhaka, Bangladesh. Interactive terminal-style portfolio with a minimal version." />
    <meta property="og:url" content="https://dev.arbishal.com/" />
    <meta property="og:image" content="https://dev.arbishal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="arBishal's Devfolio — terminal-style portfolio of Ashikur Rahman Bishal, Coding Stories, Dhaka, Bangladesh." />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="arBishal's Devfolio" />
    <meta name="twitter:description" content="Software Engineer based in Dhaka, Bangladesh. Interactive terminal-style portfolio with a minimal version." />
    <meta name="twitter:image" content="https://dev.arbishal.com/og-image.png" />

    <!-- Theme color (matches dark theme accent) -->
    <meta name="theme-color" content="#171717" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
